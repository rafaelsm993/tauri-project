[package]
name = "aevum"
version = "0.1.0"
description = "Cross-platform media tracker: movies, TV, anime, manga, books and games"
authors = ["rafaelsm993"]
license = "MIT"
repository = "https://github.com/rafaelsm993/tauri-project"
edition = "2021"

[lib]
name = "aevum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
tauri-plugin-log = "2"
log = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-dialog = "2.7"

# ── Build profiles ────────────────────────────────────────
# Rationale (see docs/BUILD_AND_RUN.md):
#  * dev: minimal debuginfo + many codegen units => fast incremental links.
#  * dev.package."*": optimise DEPENDENCIES only. Our own crate stays debuggable,
#    but reqwest/serde run at full speed, which removes dev-mode UI stutter.
#  * release: LTO + single codegen unit + stripped symbols for a small, fast bundle.

[profile.dev]
incremental = true
debug = 1
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
